<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Kinerelle. Thoughtful physiotherapy and rehabilitation support for everyday movement. Explore care pathways, plan a session request and visit your patient space."
    />
    <meta name="theme-color" content="#356875" />
    <title>
      Patient Login | Kinerelle — Physiotherapy &amp; Rehabilitation
    </title>
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/dark-mode.css" />
    <link rel="stylesheet" href="../assets/css/rtl.css" />
    <script src="../assets/js/main.js" defer></script>
  </head>
  <body class="auth-page">
    <main id="main" class="auth-layout">
      <div class="auth-visual">
        <img
          class=""
          src="../assets/images/login-care.jpg"
          alt="Practitioner supporting a seated patient’s arm movement"
          loading="lazy"
          width="1200"
          height="800"
        />
        <div>
          <span class="eyebrow">Your care, within reach</span>
          <h1>
            Care that continues.<br />
            In your own space.
          </h1>
        </div>
      </div>
      <div class="auth-side">
        <div class="auth-card">
          <div class="auth-tools" aria-label="Display preferences">
            <button
              type="button"
              class="icon-button theme-toggle"
              aria-label="Switch to dark theme"
            ></button>
            <button
              type="button"
              class="icon-button direction-toggle"
              aria-label="Switch to right-to-left"
            >
              RTL
            </button>
          </div>
          <a class="logo" href="../index.html" aria-label="Kinerelle home"
            ><img
              class="brand-full"
              src="../assets/images/logo.svg"
              alt="Kinerelle"
              width="270"
              height="68"
          /></a>

          <h2>Welcome back.</h2>
          <p>Log in to access your appointments and care plans.</p>

          <form id="auth-form" data-signup="false" class="auth-form">
            <label
              >Email<input
                type="email"
                name="email"
                required
                autocomplete="email"
                maxlength="120" /></label
            ><label
              >Password<span class="password-field"
                ><input
                  type="password"
                  name="password"
                  required
                  minlength="8"
                  autocomplete="current-password" /><button
                  type="button"
                  class="password-toggle"
                  aria-label="Show password"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                  >
                    <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg></button></span
            ></label>
            <div class="remember-row">
              <label class="check"
                ><input type="checkbox" name="remember" /> Remember me</label
              ><button type="button" class="text-button" id="forgot-password">
                Forgot password?
              </button>
            </div>
            <button type="submit" class="button">
              Log In <span aria-hidden="true">↗</span>
            </button>
            <p id="auth-status" role="status"></p>
          </form>
          <div class="auth-divider"><span>or continue with</span></div>
          <div class="social-row">
            <button
              type="button"
              class="button secondary"
              data-auth-provider="Google"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="#4285F4"
                  d="M21.6 12.2c0-.7-.1-1.4-.2-2.1H12v4h5.4a4.6 4.6 0 0 1-2 3v2.5h3.3c1.9-1.8 2.9-4.3 2.9-7.4Z"
                />
                <path
                  fill="#34A853"
                  d="M12 22c2.7 0 5-.9 6.7-2.4L15.4 17c-.9.6-2 1-3.4 1a6 6 0 0 1-5.6-4.1H3v2.6A10 10 0 0 0 12 22Z"
                />
                <path
                  fill="#FBBC05"
                  d="M6.4 13.9a6 6 0 0 1 0-3.8V7.5H3a10 10 0 0 0 0 9l3.4-2.6Z"
                />
                <path
                  fill="#EA4335"
                  d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A9.6 9.6 0 0 0 12 2a10 10 0 0 0-9 5.5l3.4 2.6A6 6 0 0 1 12 6Z"
                />
              </svg>
              Continue with Google</button
            ><button
              type="button"
              class="button secondary"
              data-auth-provider="Apple"
            >
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path
                  d="M17 12.7c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-2.9-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.7-.4 6.7 1.2 8.9.8 1.1 1.6 2.2 2.8 2.2 1.1-.1 1.6-.7 3-.7 1.3 0 1.7.7 2.9.7 1.2 0 2-.9 2.7-2 .9-1.3 1.3-2.5 1.3-2.6-.1 0-2.6-1-2.6-3.6ZM14.8 6.1c.6-.8 1.1-1.9 1-3.1-.9.1-2.1.6-2.8 1.4-.6.7-1.2 1.8-1.1 2.9 1 .1 2.1-.5 2.9-1.2Z"
                />
              </svg>
              Continue with Apple
            </button>
          </div>
          <p class="auth-switch">New here? <a href="signup.html">Sign up</a></p>
        </div>
      </div>
    </main>
    <dialog id="app-dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <h3 id="dialog-title"></h3>
        <button class="icon-button" data-close-dialog aria-label="Close dialog">
          ×
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
