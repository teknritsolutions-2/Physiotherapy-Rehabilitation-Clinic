<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Thoughtful physiotherapy and rehabilitation support for everyday movement. Explore care pathways, plan a session request and visit your patient space."
    />
    <meta name="theme-color" content="#356875" />
    <title>Patient Space | Physiotherapy & Rehabilitation Clinic</title>
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/dark-mode.css" />
    <link rel="stylesheet" href="../assets/css/rtl.css" />
    <script src="../assets/js/main.js" defer></script>
    <script src="../assets/js/dashboard.js" defer></script>
  </head>
  <body class="dashboard-page">
    <div class="dashboard-shell">
      <a class="skip-link" href="#main">Skip to content</a>
      <aside class="dashboard-sidebar" id="dashboard-nav">
        <div class="sidebar-brand">
          <a href="../index.html" class="logo"
            ><img
              src="../assets/images/logo.svg"
              alt="Clinic home"
              width="54"
              height="54"
            /><span>Patient<br /><small>space</small></span></a
          ><button
            class="drawer-close icon-button"
            aria-label="Close navigation"
          >
            ×
          </button>
        </div>
        <div class="sidebar-profile">
          <div class="avatar" id="avatar">G</div>
          <b id="sidebar-name">Guest profile</b
          ><span class="fine-print">Browser profile</span>
        </div>
        <nav aria-label="Patient portal">
          <a href="#overview" data-view="overview"
            ><span aria-hidden="true">◫</span>Overview</a
          ><a href="#book" data-view="book"
            ><span aria-hidden="true">+</span>Book Therapy Session</a
          ><a href="#appointments" data-view="appointments"
            ><span aria-hidden="true">▦</span>My Appointments</a
          ><a href="#plans" data-view="plans"
            ><span aria-hidden="true">↗</span>Exercise Plans</a
          ><a href="#history" data-view="history"
            ><span aria-hidden="true">≡</span>Session History</a
          ><a href="#progress" data-view="progress"
            ><span aria-hidden="true">▥</span>My Progress</a
          ><a href="#receipts" data-view="receipts"
            ><span aria-hidden="true">▤</span>Payment Receipts</a
          ><a href="#notifications" data-view="notifications"
            ><span aria-hidden="true">◉</span>Notifications</a
          ><a href="#profile" data-view="profile"
            ><span aria-hidden="true">○</span>Profile</a
          ><a href="#settings" data-view="settings"
            ><span aria-hidden="true">⚙</span>Settings</a
          >
        </nav>
        <div class="sidebar-bottom">
          <a href="login.html" id="logout">↗ &nbsp; Logout</a>
        </div>
      </aside>
      <div class="scrim" hidden></div>
      <div class="dashboard-main">
        <header class="dashboard-header">
          <div>
            <button
              class="icon-button menu-toggle"
              aria-label="Open patient navigation"
              aria-expanded="false"
              aria-controls="dashboard-nav"
            >
              ☰</button
            ><span class="eyebrow">Your care, in focus.</span>
          </div>
          <div class="button-row">
            <div class="utilities">
              <button
                class="icon-button theme-toggle"
                aria-label="Toggle color theme"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                >
                  <circle cx="12" cy="12" r="4" />
                  <path
                    d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"
                  />
                </svg></button
              ><button
                class="icon-button direction-toggle"
                aria-label="Switch reading direction"
              >
                RTL
              </button>
            </div>
            <a
              class="icon-button"
              href="#notifications"
              aria-label="View notifications"
              >◉</a
            ><a
              class="avatar small-avatar"
              href="#profile"
              aria-label="Edit profile"
              >G</a
            >
          </div>
        </header>
        <main id="main" tabindex="-1">
          <div id="dashboard-content"></div>
        </main>
      </div>
    </div>
    <dialog id="app-dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <h3 id="dialog-title"></h3>
        <button class="icon-button" data-close-dialog aria-label="Close dialog">
          ×
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
